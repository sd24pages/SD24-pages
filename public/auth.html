<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SD24 LIB | Access Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0e14; --primary: #6366f1; --card: #161a23; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 24px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        h2 { font-size: 1.8rem; font-weight: 800; margin-bottom: 10px; text-align: center; }
        p { color: #94a3b8; text-align: center; margin-bottom: 30px; font-size: 0.9rem; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: #94a3b8; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #2d3748; background: #0b0e14; color: white; outline: none; }
        input:focus { border-color: var(--primary); }
        .btn-auth { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .toggle-text { text-align: center; margin-top: 20px; font-size: 0.85rem; color: #94a3b8; }
        .toggle-text span { color: var(--primary); cursor: pointer; font-weight: 600; }
        .hidden { display: none; }
    </style>
</head>
<body>
	<div style="position: absolute; top: 30px; left: 8%; width: 84%; display: flex; justify-content: flex-start;">
    <a href="library.html" style="text-decoration: none; color: #94a3b8; font-weight: 700; font-size: 14px; display: flex; align-items: center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        Cancel
    </a>
</div>
    <div class="auth-card">
        <div id="login-form">
            <h2>Welcome Back</h2>
            <p>Login to access the digital archives.</p>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn-auth" onclick="handleAuth()">Login</button>
            <div class="toggle-text">New user? <span onclick="toggleForm()">Create an account</span></div>
        </div>

        <div id="signup-form" class="hidden">
            <h2>Create Account</h2>
            <p>Join SD24 to start browsing books.</p>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="name@company.com">
            </div>
            <div class="input-group">
                <label>Create Password</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn-auth" onclick="handleAuth()">Sign Up</button>
            <div class="toggle-text">Already have an account? <span onclick="toggleForm()">Login here</span></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDqVqDhAqXmPy_7tZ8K_dL8mN5oP2qR3sT",
            authDomain: "sd24pages-e149c.firebaseapp.com",
            projectId: "sd24pages-e149c",
            storageBucket: "sd24pages-e149c.appspot.com",
            messagingSenderId: "237326369522",
            appId: "1:237326369522:web:5a8b7c9d2e1f3a4b5c6d"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const functions = firebase.functions('us-central1');

        let isLoginForm = true;

        function toggleForm() {
            isLoginForm = !isLoginForm;
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('signup-form').classList.toggle('hidden');
        }

        async function handleAuth() {
            const inputs = document.querySelectorAll('input');
            
            if (isLoginForm) {
                // LOGIN FLOW
                const email = inputs[0]?.value;
                const password = inputs[1]?.value;
                
                if (!email || !password) {
                    alert('❌ Please enter email and password');
                    return;
                }

                try {
                    // Try to sign in
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    console.log('✓ Login successful:', userCredential.user.email);
                    
                    // Store auth token
                    const token = await userCredential.user.getIdToken();
                    localStorage.setItem('authToken', token);
                    localStorage.setItem('userEmail', userCredential.user.email);
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    // Redirect
                    redirectAfterAuth();
                } catch (error) {
                    if (error.code === 'auth/user-not-found') {
                        alert('❌ User not found. Please sign up first.');
                    } else if (error.code === 'auth/invalid-credential') {
                        alert('❌ Incorrect email or password.');
                    } else {
                        alert('❌ Login failed: ' + error.message);
                    }
                }
            } else {
                // SIGNUP FLOW
                const name = inputs[0]?.value;
                const email = inputs[1]?.value;
                const password = inputs[2]?.value;
                
                if (!name || !email || !password) {
                    alert('❌ Please fill in all fields');
                    return;
                }

                if (password.length < 6) {
                    alert('❌ Password must be at least 6 characters');
                    return;
                }

                try {
                    // Create user
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    
                    // Update profile
                    await user.updateProfile({ displayName: name });
                    
                    // Send verification email
                    await user.sendEmailVerification();
                    console.log('✓ Account created:', email);
                    
                    alert('✓ Account created! Check your email to verify your account.');
                    
                    // Toggle back to login form
                    document.getElementById('signup-form').classList.add('hidden');
                    document.getElementById('login-form').classList.remove('hidden');
                    isLoginForm = true;
                    
                    // Clear inputs
                    document.querySelectorAll('input').forEach(input => input.value = '');
                } catch (error) {
                    if (error.code === 'auth/email-already-in-use') {
                        alert('❌ Email already in use. Please login instead.');
                    } else if (error.code === 'auth/weak-password') {
                        alert('❌ Password is too weak. Use at least 6 characters.');
                    } else {
                        alert('❌ Signup failed: ' + error.message);
                    }
                }
            }
        }

        function redirectAfterAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            const redirect = urlParams.get('redirect');
            
            if (redirect) {
                window.location.href = `category.html?type=${encodeURIComponent(redirect)}`;
            } else {
                window.location.href = 'library.html';
            }
        }

        // Check if user is already logged in
        auth.onAuthStateChanged((user) => {
            if (user && user.emailVerified) {
                console.log('✓ User already logged in:', user.email);
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('userEmail', user.email);
                redirectAfterAuth();
            }
        });
    </script>
</body>
</html>
